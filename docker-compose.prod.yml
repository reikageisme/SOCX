version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: acs-backend:latest
    container_name: acs-backend
    restart: unless-stopped
    privileged: true
    user: root
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    volumes:
      - acs_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - acs_internal
    depends_on:
      - mongodb

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    image: acs-frontend:latest
    container_name: acs-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - acs_internal

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  nginx:
    image: nginx:alpine
    container_name: acs-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - acs_internal
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongodb:
    image: mongo:latest
    container_name: acs-mongodb
    restart: unless-stopped
    expose:
      - "27017"
    networks:
      - acs_internal
    volumes:
      - acs_mongodb_data:/data/db

networks:
  acs_internal:
    name: acs-network
    driver: bridge

volumes:
  acs_data:
    name: acs-data
  acs_mongodb_data:
    name: acs-mongodb-data
