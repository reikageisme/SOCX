version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: acs-backend-dev:latest
    container_name: acs-backend
    user: root
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    networks:
      - soc_network
    volumes:
      - ./backend/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - redis
      - clickhouse
      - mongodb
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: acs-frontend-dev:latest
    container_name: acs-frontend
    restart: always
    ports:
      - "5173:80"
    networks:
      - soc_network
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: acs-redis
    restart: always
    expose:
      - "6379"
    networks:
      - soc_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest-alpine
    container_name: acs-clickhouse
    restart: always
    expose:
      - "8123"
      - "9000"
    networks:
      - soc_network
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:latest
    container_name: acs-mongodb
    restart: always
    expose:
      - "27017"
    networks:
      - soc_network
    volumes:
      - mongodb_data:/data/db

# Lưu ý: eBPF Agent KHÔNG ĐƯỢC CHẠY trong docker-compose này nếu bạn dùng Mac/Windows,
# hoặc nếu server này không phải là mục tiêu giám sát.
# Agent nên được deploy riêng trên các máy chủ cần giám sát bằng lệnh:
# docker run --privileged -v /sys/kernel/debug:/sys/kernel/debug:rw --net host aegis_agent

networks:
  soc_network:
    name: acs-network-dev
    driver: bridge

volumes:
  redis_data:
    name: acs-redis-data
  clickhouse_data:
    name: acs-clickhouse-data
  clickhouse_logs:
    name: acs-clickhouse-logs
  mongodb_data:
    name: acs-mongodb-data-dev
